name: Pubblica Registro turno CDL

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Aggiorna logo e icone Registro CDL']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository aggiornato
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verifica icone e versiona i riferimenti nel sito pubblicato
        run: |
          python - <<'PY'
          import hashlib,json,re,struct
          from pathlib import Path
          names={'apple-touch-icon-cnc.png':180,'icon-cnc-192.png':192,'icon-cnc-512.png':512}
          versions={}
          for name,size in names.items():
              raw=(Path('icons')/name).read_bytes()
              assert raw[:8]==b'\x89PNG\r\n\x1a\n',name
              assert struct.unpack('>II',raw[16:24])==(size,size),name
              versions[name]=hashlib.sha256(raw).hexdigest()[:12]
          raw=Path('icons/icon-cnc.svg').read_bytes()
          assert b'<svg' in raw
          versions['icon-cnc.svg']=hashlib.sha256(raw).hexdigest()[:12]
          path=Path('index.html')
          source=path.read_text(encoding='utf-8')
          text=source
          for name,version in versions.items():
              for attr in ['src','href']:
                  text=text.replace(attr+'="icons/'+name+'"',attr+'="icons/'+name+'?v='+version+'"')
          text=text.replace('alt="Logo Registro turno: centro CNC con fiamme"','alt="Logo Registro turno: centro di lavoro CNC realistico"')
          scripts=lambda s:re.findall(r'<script\b[^>]*>(.*?)</script>',s,re.S)
          assert scripts(source)==scripts(text),'JavaScript modificato: pubblicazione bloccata'
          manifest=Path('manifest.webmanifest')
          data=json.loads(manifest.read_text(encoding='utf-8'))
          for icon in data['icons']:
              base=icon['src'].split('?')[0]
              name=Path(base).name
              if name in versions:
                  icon['src']=base+'?v='+versions[name]
          manifest.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          version=hashlib.sha256(manifest.read_bytes()).hexdigest()[:12]
          text=text.replace('href="manifest.webmanifest"','href="manifest.webmanifest?v='+version+'"')
          path.write_text(text,encoding='utf-8')
          PY
      - name: Correggi la chiusura HTML nel generatore senza toccare il report
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/build-cartoon-trial.py')
          code=path.read_text(encoding='utf-8')
          old="assert source.count('</body>')==1"
          new="assert source.rfind('</body>') > source.rfind('</script>')"
          assert code.count(old)==1
          code=code.replace(old,new,1)
          prefix="trial=trial.replace('</body>',"
          lines=code.splitlines()
          matches=[i for i,line in enumerate(lines) if line.startswith(prefix)]
          assert len(matches)==1
          i=matches[0]
          line=lines[i]
          assert line.endswith(',1)')
          lines[i]="head,tail=trial.rsplit('</body>',1)\ntrial=head+"+line[len(prefix):].removesuffix(',1)')+"+tail"
          corrected='\n'.join(lines)+'\n'
          compile(corrected,str(path),'exec')
          path.write_text(corrected,encoding='utf-8')
          PY
      - name: Genera la prova Cartoon separata e verifica le raccolte
        run: |
          node --check cartoon-trial.js
          python scripts/build-cartoon-trial.py
          node --check cartoon-trial-data.js
      - name: Attiva il modulo Cartoon anche nell app principale senza cambiare le bozze
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          audit=json.loads(Path('cartoon-trial-audit.json').read_text(encoding='utf-8'))
          assert audit['main']==1000 and audit['coffee']==100
          assert audit['originali_conservate']==100
          assert audit['main_unique_normalized']==1000 and audit['coffee_unique_normalized']==100
          path=Path('index.html')
          source=path.read_text(encoding='utf-8')
          assert re.search(r'</body>\s*</html>\s*$',source)
          assert source.rfind('</body>') > source.rfind('</script>')
          assert source.count("KEY='registro-cdl-v5'")==1
          assert source.count("'registro-cdl-mode'")==1
          assert 'data-cnc-trial-main' not in source
          version=hashlib.sha256(Path('cartoon-trial-data.js').read_bytes()+Path('cartoon-trial.js').read_bytes()).hexdigest()[:12]
          scripts=f'<script data-cnc-trial-main src="cartoon-trial-data.js?v={version}"></script><script data-cnc-trial-main src="cartoon-trial.js?v={version}"></script>'
          head,tail=source.rsplit('</body>',1)
          text=head+scripts+'</body>'+tail
          assert text.replace(scripts,'',1)==source
          before=re.findall(r'<script\b[^>]*>(.*?)</script>',source,re.S)
          after=re.findall(r'<script\b[^>]*>(.*?)</script>',text,re.S)
          assert after[:len(before)]==before
          path.write_text(text,encoding='utf-8')
          Path('cartoon-trial-main-status.json').write_text(json.dumps({'enabled_on_main':True,'version':version,'backup_branch':'backup-prima-prova-cartoon','baseline_commit':'bed57a2b64076527e680b6b69c50b813ee4986f8','draft_key_unchanged':True,'mode_key_unchanged':True,'report_template_unchanged':True},indent=2)+'\n',encoding='utf-8')
          PY
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepara i file del sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

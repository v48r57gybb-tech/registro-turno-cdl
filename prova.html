<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prova separata — Registro turno</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#e5f0f3;color:#233044}.bar{padding:12px;background:#fff3c6;border-bottom:2px solid #233044;line-height:1.4}.bar a{color:#134d76;font-weight:700}.bar p{margin:5px 0}.bar button{font:inherit;padding:8px;border-radius:8px;border:1px solid #233044;background:white}iframe{display:block;width:100%;height:86vh;height:86dvh;border:0}#state{padding:15px;white-space:pre-wrap}[hidden]{display:none!important}</style></head><body><div class="bar"><strong>PROVA — dati temporanei, non usare per il turno reale</strong><p><a href="./">← Torna all’app approvata</a> · <button id="restart" type="button">Ricomincia la prova</button></p><p>Genera in Cartoon, poi torna alla compilazione, passa allo stile sobrio e rigenera per confrontare i documenti. Chiudendo questa pagina perdi i dati di prova.</p></div><p id="state" role="status">Caricamento della copia sperimentale…</p><iframe id="trial" title="App di prova con dati temporanei" sandbox="allow-scripts allow-same-origin allow-modals allow-downloads allow-popups" allow="web-share" hidden></iframe><script>
'use strict';const frame=document.getElementById('trial'),state=document.getElementById('state');const root='https://raw.githubusercontent.com/v48r57gybb-tech/registro-turno-cdl/f8842e420bc58a4ce82be6c775575d198d545c1a/';document.getElementById('restart').onclick=()=>{if(confirm('Cancellare solo i dati temporanei di questa prova e ricominciare?'))location.reload();};const token=String(Date.now())+'-'+Math.random().toString(36).slice(2);window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||!event.data||event.data.token!==token)return;if(event.data.kind==='ready'){frame.hidden=false;state.hidden=true;}else if(event.data.kind==='error'){state.hidden=false;state.textContent='La prova ha riscontrato un errore. L’app principale non è stata modificata.\n'+event.data.message;}});async function text(path){const res=await fetch(root+path,{cache:'no-store',credentials:'omit'});if(!res.ok)throw Error('Impossibile caricare '+path+' ('+res.status+')');return res.text();}
(async()=>{try{const [source,css,theme,plugin]=await Promise.all(['index.html','cartoon.css','cartoon.js','report-modes.js'].map(text));const key="KEY='registro-cdl-v5'",read='localStorage.getItem(KEY)';if(!source.includes(key)||!source.includes(read))throw Error('La base di prova non corrisponde a quella attesa.');const isolated=source.replace(key,"KEY='registro-cdl-prova-temporanea'").replace(read,"'null'");const doc=new DOMParser().parseFromString(isolated,'text/html');doc.querySelectorAll('link[rel="manifest"]').forEach(n=>n.remove());const base=doc.createElement('base');base.href=new URL('./',location.href).href;doc.head.prepend(base);const link=doc.querySelector('link[href^="cartoon.css"]'),external=doc.querySelector('script[src^="cartoon.js"]');if(!link||!external)throw Error('Riferimenti del tema mancanti.');const style=doc.createElement('style');style.textContent=css;link.replaceWith(style);const marker="\n(()=>{'use strict';const generate=";const cut=theme.indexOf(marker);if(cut<0)throw Error('Caricatore di prova non riconosciuto.');const themeScript=doc.createElement('script');themeScript.textContent=theme.slice(0,cut);external.replaceWith(themeScript);const pluginScript=doc.createElement('script');pluginScript.textContent=plugin;doc.body.append(pluginScript);const ready=doc.createElement('script');ready.textContent="if(!document.getElementById('report-mode-badge'))throw Error('Modalità temporanea non inizializzata');parent.postMessage({kind:'ready',token:"+JSON.stringify(token)+"},location.origin);";doc.body.append(ready);const errors=doc.createElement('script');errors.textContent="window.addEventListener('error',function(e){parent.postMessage({kind:'error',token:"+JSON.stringify(token)+",message:e.message||'Errore nella prova'},location.origin);});";doc.head.append(errors);frame.srcdoc='<!doctype html>\n'+doc.documentElement.outerHTML;setTimeout(()=>{if(frame.hidden&&!state.hidden)state.textContent='La prova non ha completato il caricamento. Controlla la connessione e premi Ricomincia la prova. L’app principale non è stata modificata.';},20000);}catch(e){state.textContent='Impossibile aprire la prova: '+e.message+'\nUsa Torna all’app approvata. Nessuna bozza originale è stata modificata.';}})();
</script></body></html>
